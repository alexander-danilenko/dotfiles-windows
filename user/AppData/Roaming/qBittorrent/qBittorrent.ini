; qBittorrent settings tuned for a 1 Gbps connection, downloading to HDD or SSD.
; Install to: %APPDATA%\qBittorrent\qBittorrent.ini (close qBittorrent first: tray icon > Exit).
;
; Machine-specific values are intentionally omitted. Set them in Tools > Options:
; - Downloads > Default Save Path (e.g. a folder on the HDD)
; - Downloads > Keep incomplete torrents in (a folder on an SSD, for best HDD throughput)
; - Connection > Port for incoming connections (your router or VPN forwarded port)
; - Advanced > Network interface (bind to your VPN adapter, if you use one)

[Meta]
MigrationVersion=8

[LegalNotice]
Accepted=true

[Application]
ProcessMemoryPriority=Medium
GUI\Notifications\TorrentAdded=false
FileLogger\Enabled=true
FileLogger\Backup=true
FileLogger\DeleteOld=true
FileLogger\MaxSizeBytes=66560
FileLogger\Age=1
FileLogger\AgeType=1

[Appearance]
Style=Fusion

[Preferences]
General\Locale=en
General\ExitConfirm=false
Advanced\TrayIconStyle=MonoLight

[GUI]
StartUpWindowState=Normal
DownloadTrackerFavicon=false
Log\Enabled=false

[Core]
AutoDeleteAddedTorrentFile=Never

[AddNewTorrentDialog]
RememberLastSavePath=false

[AddTrackersDialog]
TrackersListURL=https://raw.githubusercontent.com/ngosang/trackerslist/refs/heads/master/trackers_best.txt

[TorrentCreator]
PieceSize=0
PaddedFileSizeLimit=-1
OptimizeAlignment=true
PrivateTorrent=false
StartSeeding=false
IgnoreRatio=false

[RSS]
AutoDownloader\DownloadRepacks=true
AutoDownloader\SmartEpisodeFilter=s(\\d+)e(\\d+), (\\d+)x(\\d+), "(\\d{4}[.\\-]\\d{1,2}[.\\-]\\d{1,2})", "(\\d{1,2}[.\\-]\\d{1,2}[.\\-]\\d{4})"

[Network]
PortForwardingEnabled=false

[BitTorrent]
; Trackers
Session\AddTrackersFromURLEnabled=true
Session\AdditionalTrackersURL=https://raw.githubusercontent.com/ngosang/trackerslist/refs/heads/master/trackers_best.txt

; Downloads
Session\StartPaused=false
Session\Preallocation=true

; Queueing
Session\QueueingSystemEnabled=true
Session\MaxActiveDownloads=4
Session\MaxActiveTorrents=10

; Connections
Session\MaxConnections=2000
Session\MaxConnectionsPerTorrent=300
Session\MaxUploads=100
Session\MaxUploadsPerTorrent=20
Session\Encryption=0
Session\uTPMixedMode=TCP
Session\IncludeOverheadInLimits=false

; Disk I/O (pread/pwrite avoids memory-mapped file issues on Windows with HDDs)
Session\DiskIOType=SimplePreadPwrite
Session\DiskQueueSize=4194304
Session\AsyncIOThreadsCount=16
Session\HashingThreadsCount=4
Session\FilePoolSize=500
Session\CheckingMemUsageSize=256

; Network buffers
Session\SendBufferWatermark=5120
Session\SendBufferLowWatermark=1024
Session\SendBufferWatermarkFactor=250
Session\SocketBacklogSize=100
