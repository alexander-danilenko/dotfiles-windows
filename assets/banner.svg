<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="title">
  <title id="title">Windows 11 Configuration</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1230"/>
      <stop offset="0.55" stop-color="#0b2a6b"/>
      <stop offset="1" stop-color="#05091c"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fd3ff"/>
      <stop offset="1" stop-color="#0078d4"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3aa0ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3aa0ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9b6bff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4cc2ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4cc2ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tiles">
      <rect x="0" y="0" width="56" height="56" rx="6"/>
      <rect x="64" y="0" width="56" height="56" rx="6"/>
      <rect x="0" y="64" width="56" height="56" rx="6"/>
      <rect x="64" y="64" width="56" height="56" rx="6"/>
    </clipPath>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <style>
    .petal { transform-box: fill-box; transform-origin: center; animation: sway 9s ease-in-out infinite; }
    .p2 { animation-duration: 12s; animation-delay: -3s; }
    .p3 { animation-duration: 15s; animation-delay: -6s; }
    .tile { animation: pop 0.8s cubic-bezier(.2,.9,.3,1.3) both; transform-box: fill-box; transform-origin: center; }
    .t2 { animation-delay: .15s; } .t3 { animation-delay: .3s; } .t4 { animation-delay: .45s; }
    .glow { animation: pulse 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .fade { animation: fade 1s ease-out .6s both; }
    .fade2 { animation: fade 1s ease-out .9s both; }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes sway { 0%,100% { transform: translateX(0) rotate(0deg); } 50% { transform: translateX(40px) rotate(4deg); } }
    @keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes pulse { 0%,100% { opacity: .6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.12); } }
    @keyframes fade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>

    <!-- Bloom-style ribbons -->
    <path class="petal" d="M560 360 C700 180 900 120 1260 160 L1260 220 C960 190 760 240 620 380 Z" fill="url(#petal)"/>
    <path class="petal p2" d="M480 380 C640 220 880 60 1260 40 L1260 100 C920 130 700 260 560 400 Z" fill="url(#petal)" opacity="0.7"/>
    <path class="petal p3" d="M700 400 C820 300 1000 260 1260 290 L1260 340 C1020 320 860 350 760 420 Z" fill="url(#petal)" opacity="0.5"/>

    <!-- Logo -->
    <g transform="translate(110 100)">
      <circle class="glow" cx="60" cy="60" r="110" fill="url(#glow)"/>
      <rect class="tile"    x="0"  y="0"  width="56" height="56" rx="6" fill="url(#tile)"/>
      <rect class="tile t2" x="64" y="0"  width="56" height="56" rx="6" fill="url(#tile)"/>
      <rect class="tile t3" x="0"  y="64" width="56" height="56" rx="6" fill="url(#tile)"/>
      <rect class="tile t4" x="64" y="64" width="56" height="56" rx="6" fill="url(#tile)"/>
      <g clip-path="url(#tiles)">
        <rect x="-80" y="-20" width="50" height="160" fill="url(#shine)" transform="skewX(-20)">
          <animate attributeName="x" values="-80;-80;220" keyTimes="0;0.7;1" dur="5s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- Text -->
    <g font-family="'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" fill="#fff">
      <text class="fade" x="290" y="158" font-size="58" font-weight="600" letter-spacing="-1">Windows 11 Configuration</text>
      <text class="fade2" x="292" y="204" font-size="22" fill="#b8d4ff" font-family="'Cascadia Code','Cascadia Mono',Consolas,monospace">&gt; winget configure --file config.yaml<tspan class="caret" fill="#4cc2ff">▌</tspan></text>
    </g>
  </g>
</svg>
