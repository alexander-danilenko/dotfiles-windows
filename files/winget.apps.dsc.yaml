# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
# winget configuration file: applications and tools
properties:
  configurationVersion: 0.2.0
  resources:
    # --- AI ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: chatgpt
      settings: { id: OpenAI.ChatGPT }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: claude
      settings: { id: Anthropic.Claude }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: claude-code
      settings: { id: Anthropic.ClaudeCode }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: herdr
      settings: { id: Herdr.Herdr }

    # --- Development ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: vscode
      settings: { id: Microsoft.VisualStudioCode }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: git
      settings: { id: Git.Git }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: jetbrains-toolbox
      settings: { id: JetBrains.Toolbox }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: uv
      settings: { id: astral-sh.uv }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: github-cli
      settings: { id: GitHub.cli }

    # --- NVIDIA GPUs only ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: cuda
      settings: { id: Nvidia.CUDA }

    # --- Internet ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: 1password
      settings: { id: AgileBits.1Password }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: brave
      settings: { id: Brave.Brave }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: discord
      settings: { id: Discord.Discord }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: chrome
      settings: { id: Google.Chrome }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: firefox
      settings: { id: Mozilla.Firefox }

    # - resource: Microsoft.WinGet.DSC/WinGetPackage
    #   id: slack
    #   settings: { id: SlackTechnologies.Slack }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: telegram
      settings: { id: Telegram.TelegramDesktop }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: vivaldi
      settings: { id: Vivaldi.Vivaldi }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: qbittorrent
      settings: { id: qBittorrent.qBittorrent }

    # --- Media ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: handbrake
      settings: { id: HandBrake.HandBrake }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: vlc
      settings: { id: VideoLAN.VLC }

    # --- System ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: disk-info
      settings: { id: CrystalDewWorld.CrystalDiskInfo }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: disk-mark
      settings: { id: CrystalDewWorld.CrystalDiskMark }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: hwinfo
      settings: { id: REALiX.HWiNFO }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: rufus
      settings: { id: Rufus.Rufus }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: synology-drive
      settings: { id: Synology.DriveClient }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: sysinternals
      settings: { id: Microsoft.Sysinternals.Suite }

    # --- Utilities ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: 7zip
      settings: { id: 7zip.7zip }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: pc-manager
      settings: { id: 9PM860492SZD }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: shutup10
      settings: { id: "OO-Software.ShutUp10" }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: lockhunter
      settings: { id: CrystalRich.LockHunter }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: obsidian
      settings: { id: Obsidian.Obsidian }

    # --- Gaming ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: steam
      settings: { id: Valve.Steam }

