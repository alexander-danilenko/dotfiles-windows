# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
# winget configuration file: system components, languages, runtimes, codecs, and redistributables
properties:
  configurationVersion: 0.2.0
  resources:
    # --- Languages ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: node
      settings: { id: OpenJS.NodeJS.LTS }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: python
      settings: { id: Python.Python.3.15 }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: jdk-25
      settings: { id: EclipseAdoptium.Temurin.25.JDK }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: go
      settings: { id: GoLang.Go }

    # MSVC linker and Windows SDK, needed by Rust's default toolchain and native Node/Python modules
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: vs-build-tools
      settings: { id: Microsoft.VisualStudio.BuildTools }

    - resource: Microsoft.VisualStudio.DSC/VSComponents
      id: vs-build-tools-cpp
      dependsOn: [vs-build-tools]
      directives: { allowPrerelease: true, securityContext: elevated } # the VS DSC module refuses to load unelevated
      settings:
        productId: Microsoft.VisualStudio.Product.BuildTools
        channelId: VisualStudio.18.Release
        includeRecommended: true
        components: [Microsoft.VisualStudio.Workload.VCTools]

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: rust
      settings: { id: Rustlang.Rustup }

    # --- Codecs ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: k-lite-codec-pack
      settings: { id: CodecGuide.K-LiteCodecPack.Mega }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: av1
      settings: { id: 9MVZQVXJBQ9V }

    # --- Runtimes ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: vcredist-2005-x64
      settings: { id: Microsoft.VCRedist.2005.x64 }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: vcredist-2005-x86
      settings: { id: Microsoft.VCRedist.2005.x86 }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: vcredist-2008-x64
      settings: { id: Microsoft.VCRedist.2008.x64 }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: vcredist-2008-x86
      settings: { id: Microsoft.VCRedist.2008.x86 }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: vcredist-2010-x64
      settings: { id: Microsoft.VCRedist.2010.x64 }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: vcredist-2010-x86
      settings: { id: Microsoft.VCRedist.2010.x86 }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: vcredist-2012-x64
      settings: { id: Microsoft.VCRedist.2012.x64 }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: vcredist-2012-x86
      settings: { id: Microsoft.VCRedist.2012.x86 }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: vcredist-2013-x64
      settings: { id: Microsoft.VCRedist.2013.x64 }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: vcredist-2013-x86
      settings: { id: Microsoft.VCRedist.2013.x86 }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: vcredist-2015plus-x64
      settings: { id: Microsoft.VCRedist.2015+.x64 }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: vcredist-2015plus-x86
      settings: { id: Microsoft.VCRedist.2015+.x86 }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: dotnet-3_1-runtime
      settings: { id: Microsoft.DotNet.DesktopRuntime.3_1 }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: dotnet-5-desktop-runtime
      settings: { id: Microsoft.DotNet.DesktopRuntime.5 }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: dotnet-6-desktop-runtime
      settings: { id: Microsoft.DotNet.DesktopRuntime.6 }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: dotnet-7-desktop-runtime
      settings: { id: Microsoft.DotNet.DesktopRuntime.7 }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: dotnet-8-desktop-runtime
      settings: { id: Microsoft.DotNet.DesktopRuntime.8 }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: dotnet-9-desktop-runtime
      settings: { id: Microsoft.DotNet.DesktopRuntime.9 }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: dotnet-10-desktop-runtime
      settings: { id: Microsoft.DotNet.DesktopRuntime.10 }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: dotnet-11-desktop-runtime
      settings: { id: Microsoft.DotNet.DesktopRuntime.11 }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: directx
      settings: { id: Microsoft.DirectX }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: openal
      settings: { id: CreativeTechnology.OpenAL }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: xna-redist
      settings: { id: Microsoft.XNARedist }
